# 合并片段，不是完整主配置，也不能作为插件导入。
# 将 YOUR_CLAUDE_NODE 替换为 Loon 中已存在的单个代理节点名称。
# 不要填写自动选择组、订阅集合或其他策略组。
# 合并到主配置已有的 [Proxy Group] 段，同名组已存在时先处理重名。
[Proxy Group]
Claude固定出口 = select,REJECT,YOUR_CLAUDE_NODE

# 默认保持 REJECT；守卫探测成功后自动选择 YOUR_CLAUDE_NODE，失败自动选 REJECT。
# 在插件参数「指定节点」填写与本组完全相同的节点名称。
# 将 Claude.plugin 的「代理指向的策略 → PROXY」绑定到 Claude固定出口。
# 每 15 秒检测一次；请求超时 3 秒，有检测延迟，不保证瞬时拦截。
# 不要在 PROXY 尚未绑定时启用插件；缺失策略不保证默认拒绝。
