# ChatGPT 网络选择与本地日志：合并到主配置对应段，不是独立配置或模块。
# 作者：可莉唯一的狗
# 图标：https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/assets/chatgpt.jpg
# 将 YOUR_PROXY 替换为已有代理节点或策略组；业务规则放在冲突规则与 FINAL 之前。
# 日志默认暂停，访问 http://chatgpt-logs.invalid/ 管理。默认不解密 ChatGPT；原生 App 使用软件连接记录。
[Proxy Group]
ChatGPT = select, DIRECT, YOUR_PROXY
[Rule]
DOMAIN-SUFFIX,chatgpt.com,ChatGPT
DOMAIN-SUFFIX,openai.com,ChatGPT
DOMAIN-SUFFIX,oaistatic.com,ChatGPT
DOMAIN-SUFFIX,oaiusercontent.com,ChatGPT
DOMAIN-SUFFIX,oaistatsig.com,ChatGPT
DOMAIN-SUFFIX,openaimerge.com,ChatGPT
DOMAIN,challenges.cloudflare.com,ChatGPT
DOMAIN,cdn.workos.com,ChatGPT
DOMAIN,forwarder.workos.com,ChatGPT
DOMAIN,frontend-apps-multi-region.workos.com,ChatGPT
DOMAIN,images.workoscdn.com,ChatGPT
DOMAIN,setup.workos.com,ChatGPT
DOMAIN,workos.imgix.net,ChatGPT
DOMAIN,chatgpt-logs.invalid,DIRECT
[Script]
ChatGPT日志页面 = type=http-request,pattern=^http://chatgpt-logs\.invalid(?::80)?(?:/|$),requires-body=false,timeout=10,script-path=https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogger.js
ChatGPT请求日志 = type=http-request,pattern=^https://(?:[a-z0-9-]+\.)*(?:chatgpt\.com|openai\.com|oaistatic\.com|oaiusercontent\.com|oaistatsig\.com|openaimerge\.com)(?::443)?/,requires-body=false,timeout=10,script-path=https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogger.js
ChatGPT响应日志 = type=http-response,pattern=^https://(?:[a-z0-9-]+\.)*(?:chatgpt\.com|openai\.com|oaistatic\.com|oaiusercontent\.com|oaistatsig\.com|openaimerge\.com)(?::443)?/,requires-body=false,timeout=10,script-path=https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogger.js
