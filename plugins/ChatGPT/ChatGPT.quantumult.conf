# ChatGPT 网络选择与本地日志：合并对应段，不替换整个主配置。
# 作者：可莉唯一的狗、ChatGPT + GPT-6.0 / GPT-6.1-sol
# 图标：https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/assets/chatgpt.jpg
# proxy 为圈 X 内置代理策略，也可换成已有节点或策略组。
# 日志默认暂停，访问 http://chatgpt-logs.invalid/ 管理。默认不解密 ChatGPT；原生 App 使用软件连接记录。
[policy]
static = ChatGPT, direct, proxy, img-url=https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/assets/chatgpt.jpg
[filter_local]
host-suffix,chatgpt.com,ChatGPT
host-suffix,openai.com,ChatGPT
host-suffix,oaistatic.com,ChatGPT
host-suffix,oaiusercontent.com,ChatGPT
host-suffix,oaistatsig.com,ChatGPT
host-suffix,openaimerge.com,ChatGPT
host,challenges.cloudflare.com,ChatGPT
host,cdn.workos.com,ChatGPT
host,forwarder.workos.com,ChatGPT
host,frontend-apps-multi-region.workos.com,ChatGPT
host,images.workoscdn.com,ChatGPT
host,setup.workos.com,ChatGPT
host,workos.imgix.net,ChatGPT
host,chatgpt-logs.invalid,direct
[rewrite_local]
^http://chatgpt-logs\.invalid(?::80)?(?:/|$) url script-echo-response https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogger.js
^https://(?:[a-z0-9-]+\.)*(?:chatgpt\.com|openai\.com|oaistatic\.com|oaiusercontent\.com|oaistatsig\.com|openaimerge\.com)(?::443)?/ url script-request-header https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogger.js
^https://(?:[a-z0-9-]+\.)*(?:chatgpt\.com|openai\.com|oaistatic\.com|oaiusercontent\.com|oaistatsig\.com|openaimerge\.com)(?::443)?/ url script-response-header https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogger.js
