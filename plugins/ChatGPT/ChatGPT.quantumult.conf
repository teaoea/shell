# 合并对应段，不替换整个主配置。proxy 为圈 X 内置代理策略，也可换成已有节点或策略组。
[policy]
static = ChatGPT, direct, proxy
[filter_remote]
https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPT.snippet, tag=ChatGPT, force-policy=ChatGPT, enabled=true
[filter_local]
host, chatgpt-logs.invalid, direct
[rewrite_remote]
https://raw.githubusercontent.com/teaoea/shell/main/plugins/ChatGPT/ChatGPTLogs.qxrewrite, tag=ChatGPT本地日志, enabled=true
[mitm]
hostname = chatgpt.com, *.chatgpt.com, openai.com, *.openai.com, oaistatic.com, *.oaistatic.com, oaiusercontent.com, *.oaiusercontent.com, oaistatsig.com, *.oaistatsig.com, openaimerge.com, *.openaimerge.com
